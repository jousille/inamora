<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3D2E2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Планер энергии">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Планер энергии v5 · inamora.ru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
// v5 — inline test
console.log("v5 loaded at", new Date().toISOString());
window._appVersion = 5;
</script>

  <!-- Экран авторизации по токену -->
  <div id="screen-auth" class="screen active">
    <div class="auth-wrap">
      <div class="auth-logo">
        <span class="logo-text">inamora</span>
        <span class="logo-dot">·</span>
        <span class="logo-sub">планер энергии</span>
      </div>
      <h1 class="auth-title">Дневник<br>энергии</h1>
      <p class="auth-desc">Введите код доступа из письма,<br>которое пришло после покупки</p>
      <div class="token-input-wrap">
        <input type="text" id="token-input" class="token-input" placeholder="Код доступа" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="token-btn" id="token-submit">Войти</button>
      </div>
      <p class="token-error" id="token-error"></p>
      <a href="https://inamora.ru" class="auth-link">inamora.ru</a>
    </div>
  </div>

  <!-- Основное приложение -->
  <div id="app" class="screen">

    <!-- Экран: День -->
    <div id="screen-day" class="app-screen active"></div>

    <!-- Экран: Итоги недели -->
    <div id="screen-week" class="app-screen"></div>

    <!-- Экран: Итоги месяца -->
    <div id="screen-month" class="app-screen"></div>

    <!-- Экран: Профиль -->
    <div id="screen-profile" class="app-screen"></div>
    <div id="screen-profile" class="app-screen"></div>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-screen="day">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>День</span>
      </button>
      <button class="nav-item" data-screen="week">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Неделя</span>
      </button>
      <button class="nav-item" data-screen="month">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        <span>Месяц</span>
      </button>
      <button class="nav-item" data-screen="profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Профиль</span>
      </button>
    </nav>

  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/day.js"></script>
  <script src="js/week.js"></script>
  <script src="js/month.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
